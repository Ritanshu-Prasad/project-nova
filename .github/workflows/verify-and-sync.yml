name: Verify Build & Shield Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Backend Python Syntax
        run: |
          echo "Verifying backend python syntax..."
          python -m py_compile backend/main.py backend/accounts.py backend/fleet.py
          echo "Backend syntax OK."

      - name: Check For Committed Secrets
        run: sh scripts/check_secrets.sh

      - name: Install Backend Dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run Backend Tests
        run: python -m pytest backend/tests -q

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Check Backend Output Against The Frontend Validators
        working-directory: frontend
        run: npm run check:contract

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: |
          echo "Running tsc -b and vite build..."
          npm run build
          echo "Frontend build OK."

  e2e:
    name: Browser Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install The Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run The Browser Tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Keep The Failure Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results

  sync-stable:
    name: Promote to Stable Deployment Branch
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Stable Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Build verified successfully. Pushing to stable branch..."
          git push origin HEAD:refs/heads/stable --force
          echo "Stable branch updated."
